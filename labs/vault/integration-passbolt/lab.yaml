---
id: vault-integration-passbolt
title: "Fetch secrets from Passbolt"
description: "Start a local Passbolt CE, authenticate with an OpenPGP key, read a secret from Ansible and compare the Passbolt model with HashiCorp Vault."
section: vault
level: l3
difficulty: intermediate
lab_type: lab
estimated_time: "40m"
skills:
  - passbolt-lookup
  - openpgp-auth
  - secret-management
distros:
  - alma9
doc_url: https://blog.stephane-robert.info/docs/infra-as-code/gestion-de-configuration/ansible/secrets-vault/integration-passbolt/
certification_tags:
  - rhce
runtime:
  type: shell
  workdir: challenge/work
  # Les deux conteneurs du lab, montés par dsoxlab (`run`/`check`) et arrêtés
  # par `clean`. Ils remplacent le setup-passbolt.sh que l'apprenant devait
  # lancer à la main — lequel créait lui-même un réseau podman, faute d'avoir
  # mieux à sa disposition.
  #
  # L'ordre compte : `db` est déclaré en premier, et sa sonde `ready_exec` est
  # satisfaite avant que Passbolt ne démarre. Sans cela, l'application tente sa
  # migration de schéma sur une base qui n'accepte pas encore de connexion.
  services:
    - name: db
      image: mariadb:11.4
      env:
        MARIADB_ROOT_PASSWORD: rootlab83
        MARIADB_DATABASE: passbolt
        MARIADB_USER: passbolt
        MARIADB_PASSWORD: passboltlab83
      # L'image fournit ce script précisément pour ça : il interroge le serveur,
      # là où un port ouvert ne prouverait que l'existence du processus.
      ready_exec: ["healthcheck.sh", "--connect"]
      ready_timeout: 120

    - name: app
      image: passbolt/passbolt:latest-ce
      ports: ["8443:443"]
      env:
        APP_FULL_BASE_URL: https://localhost:8443
        # `db`, et non une IP : les services d'un dépôt partagent un réseau
        # Docker où chacun porte son `name` en alias (dsoxlab >= 0.1.39).
        DATASOURCES_DEFAULT_HOST: db
        DATASOURCES_DEFAULT_USERNAME: passbolt
        DATASOURCES_DEFAULT_PASSWORD: passboltlab83
        DATASOURCES_DEFAULT_DATABASE: passbolt
      ready_tcp: 8443
      # Le port publié ne prouve rien (le proxy Docker l'accepte dès le `run`) :
      # on demande au serveur lui-même s'il se porte bien. Passbolt met une bonne
      # minute à migrer son schéma au premier démarrage.
      ready_exec: ["sh", "-c", "curl -sk https://localhost/healthcheck/status.json | grep -q success"]
      ready_timeout: 300
      post_start:
        # Crée le compte admin et affiche son lien d'inscription. La suite
        # (compléter l'inscription, générer la clé OpenPGP, créer la ressource
        # lab83-demo, exporter la clé privée) reste manuelle : c'est l'exercice,
        # et elle passe par un client OpenPGP.
        #
        # `su -s /bin/sh` : le compte www-data a /usr/sbin/nologin pour shell, et
        # un `su` sans `-s` sort sur « This account is currently not available ».
        #
        # `|| true` : register_user n'est pas idempotent — au second démarrage il
        # sort en 1 avec « username already in use ». post_start étant rejoué à
        # chaque `run`, sans cela le lab échouerait dès la deuxième fois. C'est
        # la seule cause d'échec attendue ici ; le compte, lui, est bien là.
        - ["sh", "-c",
           "su -s /bin/sh -m -c \"/usr/share/php/passbolt/bin/cake passbolt register_user -u admin@lab83.local -f Lab83 -l Admin -r admin\" www-data || true"]
validation:
  functional: true
  security: false
  persistence_after_reboot: false
