---
# Collections Ansible Galaxy nécessaires pour le lab et la formation RHCE.
# À installer via `ansible-galaxy collection install -r requirements.yml`.

collections:
  # Note : `ansible.builtin` est embarquée dans ansible-core, pas installable
  # depuis Galaxy. Pour la version, on s'appuie sur la version de ansible-core.

  # Modules POSIX étendus (mount, sysctl, firewalld, selinux…)
  - name: ansible.posix
    version: ">=2.0.0"

  # Modules utilitaires (urls, archives, parsers…)
  - name: community.general
    version: ">=10.0.0"

  # Modules réseau Linux (nmcli, ip, route…)
  - name: ansible.netcommon
    version: ">=8.0.0"

  # System Roles upstream (équivalent open-source de redhat.rhel_system_roles
  # qui est certifié et disponible uniquement sur Automation Hub)
  - name: fedora.linux_system_roles
    version: ">=1.97.0"

  # Pour les tests Molecule + scénarios libvirt
  - name: community.libvirt
    version: ">=2.0.0"

  # Pilote les conteneurs des scénarios Molecule (create.yml / destroy.yml du
  # driver `default`). Les 4 labs de la section molecule en dépendent : sans
  # elle, molecule saute la création et `converge` tente un SSH vers un hôte
  # qui n'existe pas.
  - name: containers.podman
    version: ">=1.19.0"

  # Lookups vault_kv2_get / vault_read du lab vault/integration-hashicorp. Elle
  # manquait ici alors que le lab l'importe : ses tests ne l'ont jamais signalé
  # parce qu'ils se skippent quand aucun Vault ne répond, et qu'aucun Vault ne
  # répondait. Le jour où un serveur a écouté sur 8200, le lab s'est exécuté et
  # a échoué sur « lookup plugin (community.hashi_vault.vault_kv2_get) not
  # found ». Un skip conditionnel masque une dépendance absente aussi bien qu'il
  # masque un service absent.
  - name: community.hashi_vault
    version: ">=7.0.0"

  # Lookup passbolt du lab vault/integration-passbolt, même famille : le lab
  # l'importe, elle était installée sur le poste mais déclarée nulle part.
  - name: anatomicjc.passbolt
    version: ">=0.0.15"

# Roles Galaxy à installer pour les exemples de la formation
roles: []
